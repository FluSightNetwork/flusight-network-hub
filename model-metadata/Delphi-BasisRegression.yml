methods: Constructs a set of "pseudo-trajectories" by splicing together (a) the observed
  part of the test season with (b) each training season's trajectory for later portions
  of the season.  Estimates a mean curve for the pseudo-trajectories by regressing
  onto a set of basis elements.  Forecasts the singleton distribution containing this
  curve, plus a large, heuristic amount of smoothing for each of the targets.  All
  training seasons precede the test season, and observations from the test season
  use mimicPastEpidataDF to approximate what the ILINet report for the forecast week
  looked like.  The code for generating these forecasts is available at https://github.com/cmu-delphi/epiforecast-R.
data_inputs: ILINet, ILI-Nearby
designated_model: false
notes: '2018 re-run; real-time 2018/19-2019/20 One model ID holding every round of
  this model: 49 real-time forecasts and 263 forecasts not made in real time (FSN
  training backcasts). The per-round flag is is_real_time in auxiliary-data/file-provenance.csv.'
