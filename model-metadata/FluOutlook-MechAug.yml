methods: This forecasting method is a combination of state of the art Machine Learning
  algorithm and a mechanistic model based on GLEAM, an epidemic stochastic generative
  model. At the begining of the flu season, GLEAM seeded by four different data sources
  (Athena, FluNearYou, Twitter, Population) generates four different forecasts for
  the flu profile. At each week along the flu season, the weekly ILI Net data augmented
  by the Machine Learning forecast is utilized in GLEAM to provide adaptive weekly
  forecast. The four weekly forecasts are combined by Bayesian Model Averaging to
  form the final forecast.
data_inputs: ILI Net, Athena Health
