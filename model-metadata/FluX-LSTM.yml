notes: 'FSN weights files call it FluX-FluX_LSTM One model ID holding every round
  of this model: 21 real-time forecasts and 298 forecasts not made in real time (FSN
  training backcasts). The per-round flag is is_real_time in auxiliary-data/file-provenance.csv.'
