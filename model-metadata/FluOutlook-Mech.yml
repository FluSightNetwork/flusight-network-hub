methods: This forecasting method is a fully mechanistic model based on GLEAM, an epidemic
  stochastic generative model. At the begining of the flu season, GLEAM seeded by
  four different data sources (Athena, FluNearYou, Twitter, Population) generates
  four different forecasts for the flu profile. At each week along the flu season,
  the weekly ILI Net data is utilized in GLEAM to provide adaptive weekly forecast.
  The four weekly forecasts are combined by Bayesian Model Averaging to form the final
  forecast.
data_inputs: ILI Net, Athena Health
designated_model: false
notes: 'One model ID holding every round of this model: 21 real-time forecasts and
  298 forecasts not made in real time (FSN training backcasts). The per-round flag
  is is_real_time in auxiliary-data/file-provenance.csv.'
