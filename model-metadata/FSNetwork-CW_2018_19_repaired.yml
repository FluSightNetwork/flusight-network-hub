notes: 'REPAIRED copy of FSNetwork-CW_2018_19 (user decision 2026-11-23: keep original
  and revised). FSN''s stacking code joined component bins on start AND end, so where
  components label the last week of the year differently (week 52, or 53 in 2014/15:
  [52, 1) vs [52, 53)) some components'' probability for that bin was dropped. In
  the affected leave-one-season-out files only that bin is recomputed, from FSN''s
  own components and weights; every other value, and every real-time file, is identical
  to the original (see validation/cv-repair.csv). FSN''s pre-season build for 2017/18
  (commit 76d9a33, 2017-11-04: ''updated cv ensemble entries and weights, based on
  latest delphi update''). Leave-one-season-out forecasts for 2010/11-2016/17. This
  model ID holds that build: the leave-one-season-out forecasts (not real-time) and
  FSN''s 2017/2018 real-time forecasts made with the same method. Components and weights:
  validation/ensemble-components.csv and FSN''s weights/ at the build commit. FSN''s
  pre-season build for 2018/19 (commit 7b8ec6b, 2018-10-23: ''updated ensemble files
  after protea model updates''; weights committed a minute later in c1d1927). Leave-one-season-out
  forecasts for 2010/11-2017/18. This model ID holds that build: the leave-one-season-out
  forecasts (not real-time) and FSN''s 2018/2019 real-time forecasts made with the
  same method. Components and weights: validation/ensemble-components.csv and FSN''s
  weights/ at the build commit. FSN''s pre-season build for 2019/20 (commit 58bd222,
  2019-10-25: ''major file overhaul for cv-ensemble files''; weights in 3b73e33).
  Leave-one-season-out forecasts for 2010/11-2018/19. This model ID holds that build:
  the leave-one-season-out forecasts (not real-time) and FSN''s 2019/2020 real-time
  forecasts made with the same method. Components and weights: validation/ensemble-components.csv
  and FSN''s weights/ at the build commit.'
